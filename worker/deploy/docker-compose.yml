# Worker + Caddy (automatic HTTPS from Let's Encrypt). Run from this folder:
#   cp .env.example .env   # fill it in
#   docker compose up -d --build
# Logs rotate at 10 MB (3 files kept) so months of message logs can never fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      DATA_DIR: /app/data
      DATA_VOLUME: the Docker volume worker-data
      PORT: "3001"
    volumes:
      - worker-data:/app/data
    expose:
      - "3001"

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    depends_on:
      - worker
    ports:
      - "80:80"
      - "443:443"
    environment:
      WORKER_DOMAIN: ${WORKER_DOMAIN:?Set WORKER_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  # WhatsApp sessions, HighLevel tokens and the activity log. Survives rebuilds and reboots.
  worker-data:
  caddy-data:
  caddy-config:
